name: Build & Release Portable App

on:
  push:
    tags:
      - 'v*' # Memicu build otomatis saat push tag (contoh: v1.0.0, v1.0.1)
  workflow_dispatch: # Memungkinkan trigger manual lewat tombol di web GitHub

permissions:
  contents: write # Wajib agar GitHub Actions diizinkan membuat Release & upload file .exe

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build:next

      - name: Build Electron Portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win portable

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
